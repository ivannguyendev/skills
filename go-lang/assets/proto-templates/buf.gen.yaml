# Code generation config (v2). Keep plugin versions in step with the
# google.golang.org/protobuf and google.golang.org/grpc versions in go.mod.
version: v2
clean: true
managed:
  enabled: true
  disable:
    # protovalidate ships its own Go package; don't rewrite its import path.
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: example.com/skeleton/gen # set to your module path + /gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt: paths=source_relative
